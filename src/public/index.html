<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2b2b2b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iPodify">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='90' fill='%23f4f4f4'/%3E%3Crect x='76' y='44' width='360' height='190' rx='18' fill='%23111'/%3E%3Crect x='92' y='60' width='328' height='158' rx='4' fill='%238ba79e'/%3E%3Ccircle cx='256' cy='364' r='112' fill='%23e2e2e2' stroke='%23ccc' stroke-width='6'/%3E%3Ccircle cx='256' cy='364' r='42' fill='%23f8f8f8' stroke='%23d4d4d4' stroke-width='4'/%3E%3C/svg%3E">
    <title>iPodify</title>
    <link rel="stylesheet" href="style.css">
    <link id="dynamic-theme-css" rel="stylesheet" href="">
</head>
<body>
    <!-- Оптические SVG-линзы для краевого преломления жидкого стекла (Water Drop Edge Refraction) -->
    <svg width="0" height="0" style="position:absolute; width:0; height:0; pointer-events:none;" aria-hidden="true">
        <defs>
            <!-- Карта линзы: прозрачный центр (RGB 128,128) и сильный градиент преломления по краям -->
            <radialGradient id="water-drop-map" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="rgb(128, 128, 128)" />
                <stop offset="72%" stop-color="rgb(128, 128, 128)" />
                <stop offset="90%" stop-color="rgb(210, 45, 128)" />
                <stop offset="100%" stop-color="rgb(20, 235, 128)" />
            </radialGradient>

            <filter id="ios26-edge-refract" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
                <feTurbulence type="turbulence" baseFrequency="0.008 0.012" numOctaves="1" seed="3" result="smoothWave" />
                <feDisplacementMap in="SourceGraphic" in2="smoothWave" scale="18" xChannelSelector="R" yChannelSelector="G" result="refracted" />
                <feSpecularLighting in="smoothWave" surfaceScale="3" specularConstant="0.9" specularExponent="35" lighting-color="#ffffff" result="spec">
                    <fePointLight x="120" y="-80" z="220" />
                </feSpecularLighting>
                <feComposite in="spec" in2="SourceAlpha" operator="in" result="specMask" />
                <feBlend in="refracted" in2="specMask" mode="screen" />
            </filter>
        </defs>
    </svg>

    <!-- Контейнер, в который динамически загружается layout.html выбранной темы -->
    <div id="theme-mount"></div>

    <!-- Web Playback SDK & Themes -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script src="themes/registry.js"></script>
    <script src="app.js"></script>
</body>
</html>
