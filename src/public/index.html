<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2b2b2b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iPodify">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='90' fill='%23f4f4f4'/%3E%3Crect x='76' y='44' width='360' height='190' rx='18' fill='%23111'/%3E%3Crect x='92' y='60' width='328' height='158' rx='4' fill='%238ba79e'/%3E%3Ccircle cx='256' cy='364' r='112' fill='%23e2e2e2' stroke='%23ccc' stroke-width='6'/%3E%3Ccircle cx='256' cy='364' r='42' fill='%23f8f8f8' stroke='%23d4d4d4' stroke-width='4'/%3E%3C/svg%3E">
    <title>iPodify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ipod-container">
        <div class="ipod">
            <!-- Top Hold Switch (Classic iPod hardware detail) -->
            <div class="hold-switch-wrapper" id="hold-switch" title="Toggle Hold Lock">
                <span class="hold-label">HOLD</span>
                <div class="hold-track">
                    <div class="hold-orange"></div>
                    <div class="hold-slider"></div>
                </div>
            </div>

            <!-- Screen Area -->
            <div class="screen-bezel">
                <div class="screen" id="screen">
                    <div class="status-bar">
                        <span id="status-title" class="status-title-text">iPod</span>
                        <div class="status-icons">
                            <span id="status-lock-icon" class="status-icon"></span>
                            <span id="status-play-icon" class="status-icon"></span>
                            <span id="battery-text" class="battery-text"></span>
                            <div class="battery-icon" id="battery-icon">
                                <div class="battery-level" id="battery-level"></div>
                            </div>
                        </div>
                    </div>

                    <div class="screen-content" id="screen-content">
                        <!-- Content will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Click Wheel Area -->
            <div class="wheel-container">
                <div class="click-wheel" id="click-wheel">
                    <div class="wheel-button menu-btn" id="btn-menu">MENU</div>
                    <div class="wheel-button prev-btn" id="btn-prev">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </div>
                    <div class="wheel-button next-btn" id="btn-next">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </div>
                    <div class="wheel-button play-pause-btn" id="btn-play-pause">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>
                    </div>

                    <div class="center-button" id="btn-center"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Web Playback SDK -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script src="app.js"></script>
</body>
</html>
