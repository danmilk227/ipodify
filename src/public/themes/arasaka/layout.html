<div class="ipod-container arasaka-shell-wrap">
    <div class="ipod arasaka-device">
        <!-- Угловые монтажные винты Torx -->
        <div class="arasaka-screw top-left"></div>
        <div class="arasaka-screw top-right"></div>
        <div class="arasaka-screw bottom-left"></div>
        <div class="arasaka-screw bottom-right"></div>

        <!-- Предупреждающая маркировка Caution -->
        <div class="arasaka-hazard-band">
            <span class="hazard-text">ARASAKA CORP // HIGH VOLTAGE</span>
        </div>

        <!-- Переключатель блокировки нейроинтерфейса -->
        <div class="hold-switch-wrapper arasaka-hold" id="hold-switch" title="Hardware Override">
            <span class="hold-label">LOCK</span>
            <div class="hold-track">
                <div class="hold-orange"></div>
                <div class="hold-slider"></div>
            </div>
        </div>

        <!-- Укрепленный титановый безель экрана -->
        <div class="screen-bezel arasaka-screen-bezel">
            <div class="screen arasaka-screen" id="screen">
                <div class="status-bar arasaka-status-bar">
                    <span id="status-title" class="status-title-text">RELIC_OS v2.7</span>
                    <div class="status-icons">
                        <span id="status-lock-icon" class="status-icon"></span>
                        <span id="status-play-icon" class="status-icon"></span>
                        <span id="battery-text" class="battery-text"></span>
                        <div class="battery-icon arasaka-battery" id="battery-icon">
                            <div class="battery-level" id="battery-level"></div>
                        </div>
                    </div>
                </div>

                <div class="screen-content" id="screen-content"></div>
            </div>
        </div>

        <!-- Фрезерованный Click Wheel с радиальной нарезкой -->
        <div class="wheel-container arasaka-wheel-wrap">
            <div class="click-wheel arasaka-wheel" id="click-wheel">
                <div class="wheel-button menu-btn" id="btn-menu">ESC</div>
                <div class="wheel-button prev-btn" id="btn-prev">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </div>
                <div class="wheel-button next-btn" id="btn-next">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </div>
                <div class="wheel-button play-pause-btn" id="btn-play-pause">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </div>

                <div class="center-button arasaka-center-button" id="btn-center">
                    <span class="arasaka-btn-glyph">EXE</span>
                </div>
            </div>
        </div>

        <div class="arasaka-footer-label">CYBERWARE SPEC: MK.IV // S/N 2077-NC</div>
    </div>
</div>
