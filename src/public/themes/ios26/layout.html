<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS 26 Liquid Glass — Clean Refraction</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="ios26">

<!-- Сцена с фоном -->
<div class="ios26-stage">
    <div class="ios26-ambient-cover"></div>
    <div class="ios26-pill pill-green"></div>
    <div class="ios26-pill pill-rainbow"></div>
    <div class="ios26-pill pill-blue"></div>
</div>

<!-- Корпус устройства -->
<div class="ipod-container ios26-shell-wrap">
    <div class="ipod ios26-device">
        
        <!-- HOLD -->
        <div class="hold-switch-wrapper ios26-hold" id="hold-switch">
            <span class="hold-label">HOLD</span>
            <div class="hold-track">
                <div class="hold-orange"></div>
                <div class="hold-slider"></div>
            </div>
        </div>

        <!-- Экран -->
        <div class="screen-bezel ios26-screen-lens">
            <div class="screen" id="screen">
                <div class="status-bar">
                    <span id="status-title">Now Playing</span>
                    <div class="status-icons">
                        <span>▶</span>
                        <span>🔋</span>
                        <div class="battery-icon" id="battery-icon">
                            <div class="battery-level" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>
                <div class="screen-content" id="screen-content">
                    <!-- Контент экрана -->
                    <div class="menu-list">
                        <div class="menu-item">Music</div>
                        <div class="menu-item active">Now Playing</div>
                        <div class="menu-item">Settings</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Click Wheel -->
        <div class="wheel-container ios26-wheel-wrap">
            <div class="click-wheel ios26-wheel" id="click-wheel">
                <div class="wheel-button menu-btn" id="btn-menu">MENU</div>
                <div class="wheel-button prev-btn" id="btn-prev">◀◀</div>
                <div class="wheel-button next-btn" id="btn-next">▶▶</div>
                <div class="wheel-button play-pause-btn" id="btn-play-pause">▶❚❚</div>
                <div class="center-button ios26-center-drop" id="btn-center"></div>
            </div>
        </div>
        
    </div>
</div>

</body>
</html>
