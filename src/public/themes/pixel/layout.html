<div class="ipod-container pixel-shell-wrap">
    <div class="ipod pixel-device">
        <!-- Пиксельный тумблер POWER / HOLD -->
        <div class="hold-switch-wrapper pixel-hold" id="hold-switch" title="Toggle Lock">
            <span class="hold-label">POWER</span>
            <div class="hold-track">
                <div class="hold-orange"></div>
                <div class="hold-slider"></div>
            </div>
        </div>

        <div class="pixel-badge">8-BIT AUDIO SYSTEM</div>

        <!-- Ступенчатая пиксельная рамка экрана -->
        <div class="screen-bezel pixel-screen-bezel">
            <div class="screen pixel-screen" id="screen">
                <div class="status-bar pixel-status-bar">
                    <span id="status-title" class="status-title-text">POCKET-OS</span>
                    <div class="status-icons">
                        <span id="status-lock-icon" class="status-icon"></span>
                        <span id="status-play-icon" class="status-icon"></span>
                        <span id="battery-text" class="battery-text"></span>
                        <div class="battery-icon pixel-battery" id="battery-icon">
                            <div class="battery-level" id="battery-level"></div>
                        </div>
                    </div>
                </div>

                <div class="screen-content" id="screen-content"></div>
            </div>
        </div>

        <!-- Пиксельное ступенчатое колесо D-Pad Click Wheel -->
        <div class="wheel-container pixel-wheel-wrap">
            <div class="click-wheel pixel-wheel" id="click-wheel">
                <div class="wheel-button menu-btn" id="btn-menu">SELECT</div>
                <div class="wheel-button prev-btn" id="btn-prev">&lt;&lt;</div>
                <div class="wheel-button next-btn" id="btn-next">&gt;&gt;</div>
                <div class="wheel-button play-pause-btn" id="btn-play-pause">START</div>

                <div class="center-button pixel-center-button" id="btn-center">
                    <div class="pixel-a-btn">A</div>
                </div>
            </div>
        </div>

        <div class="pixel-footer-label">DOT MATRIX STEREO SOUND // 32x32 CHIP</div>
    </div>
</div>
