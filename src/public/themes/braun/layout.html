<div class="ipod-container braun-shell-wrap">
    <div class="ipod braun-device">
        <!-- Аналоговый тумблер питания / блокировки -->
        <div class="hold-switch-wrapper braun-hold" id="hold-switch" title="Power / Lock">
            <span class="hold-label">EIN / AUS</span>
            <div class="hold-track">
                <div class="hold-orange"></div>
                <div class="hold-slider"></div>
            </div>
        </div>

        <!-- Верхний шильдик Браун -->
        <div class="braun-brand-header">
            <span class="braun-logo-text">BRAUN</span>
            <span class="braun-model-no">T 3 // AUDIO</span>
        </div>

        <!-- Перфорированная решетка динамика слева -->
        <div class="braun-speaker-grille">
            <div class="grille-row"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="grille-row"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="grille-row"><span></span><span></span><span></span><span></span><span></span></div>
        </div>

        <!-- Экран измерительного прибора -->
        <div class="screen-bezel braun-screen-bezel">
            <div class="screen braun-screen" id="screen">
                <div class="status-bar braun-status-bar">
                    <span id="status-title" class="status-title-text">BRAUN AUDIO</span>
                    <div class="status-icons">
                        <span id="status-lock-icon" class="status-icon"></span>
                        <span id="status-play-icon" class="status-icon"></span>
                        <span id="battery-text" class="battery-text"></span>
                        <div class="battery-icon braun-battery" id="battery-icon">
                            <div class="battery-level" id="battery-level"></div>
                        </div>
                    </div>
                </div>

                <div class="screen-content" id="screen-content"></div>
            </div>
        </div>

        <!-- Рельефное рифленое колесо настройки радиоприёмника -->
        <div class="wheel-container braun-wheel-wrap">
            <div class="click-wheel braun-wheel" id="click-wheel">
                <div class="braun-dial-ribs"></div>
                <div class="wheel-button menu-btn" id="btn-menu">MENU</div>
                <div class="wheel-button prev-btn" id="btn-prev">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </div>
                <div class="wheel-button next-btn" id="btn-next">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </div>
                <div class="wheel-button play-pause-btn" id="btn-play-pause">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </div>

                <!-- Центральная кнопка с культовой оранжевой сигнальной точкой Дитера Рамса -->
                <div class="center-button braun-center-button" id="btn-center">
                    <div class="braun-orange-dot"></div>
                </div>
            </div>
        </div>

        <div class="braun-designer-credit">DESIGN: DIETER RAMS // 1958</div>
    </div>
</div>
