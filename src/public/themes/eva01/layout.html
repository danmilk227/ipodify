<div class="ipod-container eva-shell-wrap">
    <div class="ipod eva-device">
        <!-- Тактический переключатель блокировки NERV -->
        <div class="hold-switch-wrapper eva-hold" id="hold-switch" title="Emergency Lock">
            <span class="hold-label">SAFETY</span>
            <div class="hold-track">
                <div class="hold-orange"></div>
                <div class="hold-slider"></div>
            </div>
        </div>

        <div class="eva-hazard-stripe"></div>

        <!-- Скошенный визор терминала MAGI -->
        <div class="screen-bezel eva-screen-bezel">
            <div class="screen eva-screen" id="screen">
                <div class="status-bar eva-status-bar">
                    <span id="status-title" class="status-title-text">MAGI_SYS</span>
                    <div class="status-icons">
                        <span id="status-lock-icon" class="status-icon"></span>
                        <span id="status-play-icon" class="status-icon"></span>
                        <span id="battery-text" class="battery-text"></span>
                        <div class="battery-icon eva-battery" id="battery-icon">
                            <div class="battery-level" id="battery-level"></div>
                        </div>
                    </div>
                </div>

                <div class="screen-content" id="screen-content"></div>
            </div>
        </div>

        <!-- Тактильный Click Wheel NERV -->
        <div class="wheel-container eva-wheel-wrap">
            <div class="click-wheel eva-wheel" id="click-wheel">
                <div class="wheel-button menu-btn" id="btn-menu">MENU</div>
                <div class="wheel-button prev-btn" id="btn-prev">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </div>
                <div class="wheel-button next-btn" id="btn-next">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </div>
                <div class="wheel-button play-pause-btn" id="btn-play-pause">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </div>

                <div class="center-button eva-center-button" id="btn-center">
                    <span class="eva-center-glyph">EVA</span>
                </div>
            </div>
        </div>

        <div class="eva-unit-tag">TEST TYPE // 01</div>
    </div>
</div>
