<div class="ipod-container neopixel-shell-wrap">
    <div class="ipod neopixel-device">
        <!-- Аккуратный пиксельный тумблер HOLD -->
        <div class="hold-switch-wrapper neopixel-hold" id="hold-switch" title="Toggle Lock">
            <span class="hold-label">HOLD</span>
            <div class="hold-track">
                <div class="hold-orange"></div>
                <div class="hold-slider"></div>
            </div>
        </div>

        <!-- Скошенный безель экрана с аккуратной пиксельной ступенькой -->
        <div class="screen-bezel neopixel-screen-bezel">
            <div class="screen neopixel-screen" id="screen">
                <div class="status-bar neopixel-status-bar">
                    <span id="status-title" class="status-title-text">iPod</span>
                    <div class="status-icons">
                        <span id="status-lock-icon" class="status-icon"></span>
                        <span id="status-play-icon" class="status-icon"></span>
                        <span id="battery-text" class="battery-text"></span>
                        <div class="battery-icon neopixel-battery" id="battery-icon">
                            <div class="battery-level" id="battery-level"></div>
                        </div>
                    </div>
                </div>

                <div class="screen-content" id="screen-content"></div>
            </div>
        </div>

        <!-- Круглое колесо Click Wheel со ступенчатым пиксельным контуром -->
        <div class="wheel-container neopixel-wheel-wrap">
            <div class="click-wheel neopixel-wheel" id="click-wheel">
                <div class="wheel-button menu-btn" id="btn-menu">MENU</div>
                <div class="wheel-button prev-btn" id="btn-prev">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h3v12H6zm3 6l9 6V6z"/></svg>
                </div>
                <div class="wheel-button next-btn" id="btn-next">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l9-6-9-6v12zm9-12v12h3V6h-3z"/></svg>
                </div>
                <div class="wheel-button play-pause-btn" id="btn-play-pause">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </div>

                <div class="center-button neopixel-center-button" id="btn-center"></div>
            </div>
        </div>

        <div class="neopixel-footer-label">&#9632; 64x64 PIXEL STEREO CORE &#9632;</div>
    </div>
</div>
